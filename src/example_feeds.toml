name = "Rust Blog"

[[category.1.feed]]
url  = "https://this-week-in-rust.org/rss.xml"
name = "This Week in Rust"

[category.2]
title = "Linux"

[[category.2.feed]]
url  = "https://www.kernel.org/feeds/kdiff.xml"
name = "Kernel.org"

