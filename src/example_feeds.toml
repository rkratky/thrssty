# thrssty feeds file
#
# Copy this file to ~/.config/thrssty/feeds.toml and edit it to add your feeds.
# Feeds can be grouped into named categories, or listed without a category.

# ── Categorised feeds ─────────────────────────────────────────────────────────

[category.1]
title = "Rust"

[[category.1.feed]]
