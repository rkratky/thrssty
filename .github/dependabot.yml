version: 2
updates:
  - package-ecosystem: "cargo"
    # Look for `Cargo.toml` and `Cargo.lock` in the root directory
    directory: "/"
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch patch updates into one PR. Minor bumps stay separate: for 0.x
      # crates such as ratatui and crossterm a minor bump is usually breaking,
      # and Dependabot would otherwise group those as "minor".
      patch-updates:
        applies-to: version-updates
        update-types:
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
