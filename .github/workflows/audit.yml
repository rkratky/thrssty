name: Security audit

on:
  schedule:
    # Runs at 00:00 UTC everyday
    - cron: '0 0 * * *'
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action publishes its result as a check run. It only files issues for
      # scheduled runs, which this project does not rely on, so `issues: write`
      # is deliberately not granted.
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
