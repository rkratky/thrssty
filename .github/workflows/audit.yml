name: Security audit

on:
  schedule:
    # Runs at 00:00 UTC everyday
    - cron: '0 0 * * *'
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publish the audit result as a check run (required by branch protection).
      checks: write
      # Open an issue when a scheduled audit finds a new advisory.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

